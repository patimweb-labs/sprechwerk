# Pakete des Fensters: Linux (.deb, .rpm, AppImage), Flatpak, Windows, macOS.
#
# Ein Baustein, zwei Aufrufer:
#   * `pruefen.yml` bei jedem Push und PR — damit ein Bruch auf Windows oder
#     macOS im PR auffällt und nicht erst im Release. Die Pakete liegen danach
#     als Artefakte am Lauf (zum Ausprobieren vor dem Release).
#   * `release.yml` mit dem Tag — dort werden dieselben Artefakte ans Release
#     gehängt.
#
# **Opus** wird zur Laufzeit geladen (`crates/audio/src/opus.rs`). Unter Linux
# und im Flatpak bringt das System es mit; für Windows und macOS wird es hier
# aus den Quellen gebaut und ins Paket gelegt:
#   * Windows: `opus.dll` neben `sprechwerk-desktop.exe`, mit statischer
#     C-Laufzeit — sonst bräuchte die DLL das „Visual C++ Redistributable".
#   * macOS: `libopus.0.dylib` in `Sprechwerk.app/Contents/Frameworks`, für
#     arm64 und x86_64 (eine Datei, `lipo`), ab macOS 11. Homebrew-Bibliotheken
#     liefen nur ab der macOS-Version des Bau-Rechners.
#
# **Unsigniert** (kein Apple-Entwicklerkonto, kein Windows-Zertifikat): macOS
# wird nur ad hoc signiert, Gatekeeper und SmartScreen warnen beim ersten
# Start. Was Nutzer dann tun, steht in der README.

name: pakete

on:
  workflow_call:
    inputs:
      ref:
        description: "Was gebaut wird (Tag); leer = der auslösende Stand"
        type: string
        default: ""
      pruefen:
        description: "Zusätzlich Clippy auf der Plattform (im PR ja, im Release nein)"
        type: boolean
        default: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  OPUS_VERSION: "1.5.2"
  # Offizielle Prüfsumme aus https://downloads.xiph.org/releases/opus/SHA256SUMS.txt
  OPUS_SHA256: 65c1d2f78b9f2fb20082c38cbe47c951ad5839345876e46941612ee87f9a7ce1

jobs:
  linux:
    name: Linux (.deb, .rpm, AppImage)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      # Dieselben Bibliotheken wie in `pruefen.yml`; `file` braucht der
      # AppImage-Bau.
      - name: Systembibliotheken für Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev librsvg2-dev patchelf \
            build-essential pkg-config file

      - name: Komponentenbibliothek holen
        shell: bash
        env:
          TOKEN: ${{ secrets.WEPPELMANN_UI_TOKEN }}
        # `$(pwd)` statt `github.workspace`: der ist unter Windows ein Pfad mit
        # Backslashes, und das hier läuft in Bash.
        run: &komponenten |
          ziel="$(pwd)/../weppelmann-ui"
          url="https://github.com/Smotherer007/weppelmann-ui.git"
          if [ -n "$TOKEN" ]; then
            url="https://x-access-token:${TOKEN}@github.com/Smotherer007/weppelmann-ui.git"
          fi
          git clone --depth 1 "$url" "$ziel"
          cd "$ziel" && npm ci --no-audit --no-fund && npm run -s tokens

      - name: Abhängigkeiten der Oberfläche
        run: cd ui && npm ci --no-audit --no-fund

      # `APPIMAGE_EXTRACT_AND_RUN`: linuxdeploy ist selbst ein AppImage und
      # bräuchte sonst FUSE, das der Läufer nicht hat.
      - name: Pakete bauen
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: npm --prefix ui run pakete

      - uses: actions/upload-artifact@v7
        with:
          name: pakete-linux
          if-no-files-found: error
          path: |
            crates/desktop/target/release/bundle/deb/*.deb
            crates/desktop/target/release/bundle/rpm/*.rpm
            crates/desktop/target/release/bundle/appimage/*.AppImage

  # Umgepackt aus dem `.deb` (Begründung im Manifest).
  flatpak:
    name: Flatpak
    needs: linux
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: flatpak-builder
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends flatpak flatpak-builder
          flatpak remote-add --user --if-not-exists flathub \
            https://dl.flathub.org/repo/flathub.flatpakrepo

      - uses: actions/download-artifact@v8
        with:
          name: pakete-linux
          path: linux

      - name: Bauen
        run: |
          cp linux/deb/*.deb crates/desktop/packaging/flatpak/sprechwerk.deb
          flatpak-builder --user --install-deps-from=flathub --repo=repo --force-clean \
            bau crates/desktop/packaging/flatpak/de.weppelmann.Sprechwerk.yml
          version=$(jq -r .version crates/desktop/tauri.conf.json)
          flatpak build-bundle repo "Sprechwerk_${version}_x86_64.flatpak" de.weppelmann.Sprechwerk \
            --runtime-repo=https://dl.flathub.org/repo/flathub.flatpakrepo

      - uses: actions/upload-artifact@v7
        with:
          name: pakete-flatpak
          if-no-files-found: error
          path: Sprechwerk_*.flatpak

  windows:
    name: Windows (.exe, .msi)
    runs-on: windows-2025
    defaults:
      run:
        shell: bash
    env:
      # `aws-lc-sys` (TLS) braucht unter Windows sonst NASM; die mitgelieferten
      # vorgebauten Objekte tun es auch.
      AWS_LC_SYS_PREBUILT_NASM: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Opus bauen (opus.dll, statische C-Laufzeit)
        run: |
          curl -fsSLo opus.tar.gz "https://downloads.xiph.org/releases/opus/opus-${OPUS_VERSION}.tar.gz"
          echo "${OPUS_SHA256}  opus.tar.gz" | sha256sum -c
          tar xzf opus.tar.gz
          cmake -S "opus-${OPUS_VERSION}" -B opus-bau \
            -DBUILD_SHARED_LIBS=ON -DOPUS_BUILD_PROGRAMS=OFF -DOPUS_BUILD_TESTING=OFF \
            -DCMAKE_POLICY_DEFAULT_CMP0091=NEW -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded
          cmake --build opus-bau --config Release
          mkdir -p crates/desktop/opus
          cp opus-bau/Release/opus.dll crates/desktop/opus/opus.dll

      - name: Komponentenbibliothek holen
        env:
          TOKEN: ${{ secrets.WEPPELMANN_UI_TOKEN }}
        run: *komponenten

      - name: Abhängigkeiten der Oberfläche
        run: cd ui && npm ci --no-audit --no-fund

      - name: Werkzeuge (Clippy auf Windows)
        if: inputs.pruefen
        run: cd crates/desktop && cargo clippy --all-targets -- -D warnings

      - name: Pakete bauen
        run: npm --prefix ui run pakete

      - uses: actions/upload-artifact@v7
        with:
          name: pakete-windows
          if-no-files-found: error
          path: |
            crates/desktop/target/release/bundle/nsis/*.exe
            crates/desktop/target/release/bundle/msi/*.msi

  macos:
    name: macOS (.dmg, Apple Silicon + Intel)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - uses: dtolnay/rust-toolchain@stable

      # Im Repository ausgeführt, damit die Ziele für die Version aus
      # `rust-toolchain.toml` dazukommen.
      - name: Rust für beide Architekturen
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      # Je Architektur getrennt gebaut und dann zusammengefügt: Opus prüft beim
      # Einrichten, welche SIMD-Befehle es benutzen kann — für zwei
      # Architekturen in einem Lauf ginge das schief.
      - name: Opus bauen (libopus.0.dylib, arm64 + x86_64)
        run: |
          curl -fsSLo opus.tar.gz "https://downloads.xiph.org/releases/opus/opus-${OPUS_VERSION}.tar.gz"
          echo "${OPUS_SHA256}  opus.tar.gz" | shasum -a 256 -c
          tar xzf opus.tar.gz
          for arch in arm64 x86_64; do
            cmake -S "opus-${OPUS_VERSION}" -B "opus-$arch" \
              -DBUILD_SHARED_LIBS=ON -DOPUS_BUILD_PROGRAMS=OFF -DOPUS_BUILD_TESTING=OFF \
              -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES=$arch \
              -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0
            cmake --build "opus-$arch"
          done
          mkdir -p crates/desktop/opus
          lipo -create opus-arm64/libopus.0.dylib opus-x86_64/libopus.0.dylib \
            -output crates/desktop/opus/libopus.0.dylib
          lipo -info crates/desktop/opus/libopus.0.dylib

      - name: Komponentenbibliothek holen
        env:
          TOKEN: ${{ secrets.WEPPELMANN_UI_TOKEN }}
        run: *komponenten

      - name: Abhängigkeiten der Oberfläche
        run: cd ui && npm ci --no-audit --no-fund

      - name: Werkzeuge (Clippy auf macOS)
        if: inputs.pruefen
        run: cd crates/desktop && cargo clippy --all-targets -- -D warnings

      - name: Pakete bauen
        run: npm --prefix ui run pakete -- --target universal-apple-darwin

      - uses: actions/upload-artifact@v7
        with:
          name: pakete-macos
          if-no-files-found: error
          path: crates/desktop/target/universal-apple-darwin/release/bundle/dmg/*.dmg
