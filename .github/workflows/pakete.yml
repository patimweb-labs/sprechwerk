# Pakete der **zwei Anwendungen** (ADR 0013), getrennt nach Client und Server:
# Linux (tar.gz, .deb, .rpm, AppImage), Flatpak je Anwendung, Windows (.msi,
# .zip), macOS (ein .dmg je Anwendung).
#
#   Client  „Sprechwerk"          sprechwerk-fenster, sprechwerk-cli
#   Server  „Sprechwerk Server"   sprechwerk, sprechwerk-server-fenster
#
# Der Container ist Serversache und steht in `release.yml`.
#
# Aufbau wie bei FigCraft: die Arbeit steht in Skripten unter `packaging/`,
# die auch lokal laufen; dieser Workflow stellt nur Werkzeuge bereit und ruft
# sie auf. Reines Rust — kein Node, kein WebKit, keine Komponentenbibliothek.
#
# Ein Baustein, zwei Aufrufer:
#   * `pruefen.yml` bei jedem Push und PR — ein Bruch auf Windows oder macOS
#     fällt im PR auf. Die Pakete liegen danach als Artefakte am Lauf.
#   * `release.yml` mit dem Tag — dieselben Artefakte gehen ans Release.
#
# **Opus** wird zur Laufzeit geladen (`crates/audio/src/opus.rs`). Linux und
# Flatpak bringen es mit; für Windows und macOS wird es hier aus den Quellen
# gebaut und mit ausgeliefert (`packaging/opus/`, nicht im Repository):
#   * Windows: `opus.dll` neben den `.exe`, statische C-Laufzeit.
#   * macOS: `libopus.0.dylib` in `Contents/Frameworks`, arm64 + x86_64, ab 11.
#
# **Unsigniert** (kein Apple-Entwicklerkonto, kein Windows-Zertifikat): macOS
# wird ad hoc signiert, Gatekeeper und SmartScreen fragen beim ersten Start.

name: pakete

on:
  workflow_call:
    inputs:
      ref:
        description: "Was gebaut wird (Tag); leer = der auslösende Stand"
        type: string
        default: ""
      pruefen:
        description: "Zusätzlich Clippy auf der Plattform (im PR ja, im Release nein)"
        type: boolean
        default: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  OPUS_VERSION: "1.5.2"
  OPUS_SHA256: 65c1d2f78b9f2fb20082c38cbe47c951ad5839345876e46941612ee87f9a7ce1
  NFPM_VERSION: "2.43.0"

jobs:
  linux:
    name: Linux (tar.gz, .deb, .rpm, AppImage)
    # 22.04: ältere glibc (2.35) — die Programme laufen damit auch auf älteren
    # Systemen, nicht nur auf dem neuesten.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - uses: dtolnay/rust-toolchain@stable

      # Fenster (winit/glow) und Ton laden ihre Systembibliotheken zur
      # Laufzeit — zum Bauen genügen Compiler und pkg-config. `file` und
      # `libfuse2` braucht appimagetool.
      - name: Werkzeuge
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential pkg-config file libfuse2
          curl -fsSLO "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/nfpm_${NFPM_VERSION}_Linux_x86_64.tar.gz"
          curl -fsSLO "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/checksums.txt"
          sha256sum -c --ignore-missing checksums.txt
          tar xzf "nfpm_${NFPM_VERSION}_Linux_x86_64.tar.gz" nfpm
          sudo install -m755 nfpm /usr/local/bin/nfpm
          curl -fsSLo appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          sudo install -m755 appimagetool /usr/local/bin/appimagetool

      - name: Clippy (Fenster)
        if: inputs.pruefen
        run: cargo clippy --locked -p sprechwerk-fenster -p sprechwerk-server-fenster --all-targets -- -D warnings

      - name: Pakete bauen
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: packaging/linux/paket.sh

      - uses: actions/upload-artifact@v7
        with:
          name: pakete-linux
          if-no-files-found: error
          path: |
            dist/*.tar.gz
            dist/*.deb
            dist/*.rpm
            dist/*.AppImage
            dist/flatpak-quelle/*.tar.gz

  # Ein Flatpak je Anwendung: eigene Kennung, eigenes Archiv aus `linux`.
  flatpak:
    name: Flatpak ${{ matrix.name }}
    needs: linux
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Client
            id: de.weppelmann.Sprechwerk
            manifest: packaging/flatpak/de.weppelmann.Sprechwerk.yml
            tar: sprechwerk
            datei: Sprechwerk
            artefakt: pakete-flatpak
            glob: "sprechwerk-[0-9]*-linux-x86_64.tar.gz"
          - name: Server
            id: de.weppelmann.Sprechwerk.Server
            manifest: packaging/flatpak/de.weppelmann.Sprechwerk.Server.yml
            tar: sprechwerk-server
            datei: Sprechwerk-Server
            artefakt: pakete-flatpak-server
            glob: "flatpak-quelle/sprechwerk-server.tar.gz"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: flatpak-builder
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends flatpak flatpak-builder
          flatpak remote-add --user --if-not-exists flathub \
            https://dl.flathub.org/repo/flathub.flatpakrepo

      - uses: actions/download-artifact@v8
        with:
          name: pakete-linux
          path: linux

      - name: Bauen
        run: |
          version=$(packaging/version.sh)
          cp linux/${{ matrix.glob }} "packaging/flatpak/${{ matrix.tar }}.tar.gz"
          # `--disable-rofiles-fuse` und `--keep-build-dirs` sind für den
          # Fehlerfall da: AppStream liest den Baum dann direkt statt über
          # FUSE, und `bau/files` bleibt nach einem Abbruch stehen, damit der
          # Diagnoseschritt unten hineinschauen kann.
          # `--default-branch=stable`: ohne das exportiert flatpak-builder nach
          # `master`, und genau so steht die Anwendung dann in `flatpak list`
          # und in der Paketverwaltung.
          flatpak-builder --user --install-deps-from=flathub --repo=repo --force-clean \
            --disable-rofiles-fuse --keep-build-dirs --default-branch=stable \
            bau "${{ matrix.manifest }}"
          # Der Zweig ist das vierte Argument. Ohne ihn sucht `build-bundle`
          # `master` — und der Export heißt seit `--default-branch` `stable`.
          flatpak build-bundle repo "${{ matrix.datei }}-${version}-x86_64.flatpak" \
            "${{ matrix.id }}" stable \
            --runtime-repo=https://dl.flathub.org/repo/flathub.flatpakrepo

      # Nur wenn der Bau scheitert: sagen, woran es lag. Die Ausgabe von
      # AppStream ist knapp — sie nennt den Dateinamen nur mit `-v`, und die
      # Schicht darüber schreibt es gar nicht erst ins Protokoll.
      - name: Woran es lag
        if: failure()
        run: |
          echo "flatpak:           $(flatpak --version)"
          echo "flatpak-builder:   $(flatpak-builder --version)"
          echo "appstreamcli:      $(appstreamcli --version)"
          echo "librsvg:           $(dpkg -l | grep librsvg | awk '{print $2}' | tr '\n' ' ')"
          baum=$(ls -d bau/files 2>/dev/null | head -1)
          echo "Baum: ${baum:-keiner}"
          if [ -n "$baum" ]; then
            find "$baum" -maxdepth 5 | sort | head -40
            echo "--- compose noch einmal, ausführlich ---"
            mkdir -p /tmp/aus
            appstreamcli compose --origin=flatpak --prefix=/ \
              --components="${{ matrix.id }},${{ matrix.id }}.desktop" \
              --result-root=/tmp/aus --no-net -v --print-report=full "$baum" 2>&1 | tail -40 || true
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artefakt }}
          if-no-files-found: error
          path: ${{ matrix.datei }}-*.flatpak

  windows:
    name: Windows (.msi, .zip)
    runs-on: windows-2025
    defaults:
      run:
        shell: bash
    env:
      AWS_LC_SYS_PREBUILT_NASM: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - uses: dtolnay/rust-toolchain@stable

      - name: Opus bauen (opus.dll, statische C-Laufzeit)
        run: |
          curl -fsSLo opus.tar.gz "https://downloads.xiph.org/releases/opus/opus-${OPUS_VERSION}.tar.gz"
          echo "${OPUS_SHA256}  opus.tar.gz" | sha256sum -c
          tar xzf opus.tar.gz
          cmake -S "opus-${OPUS_VERSION}" -B opus-bau \
            -DBUILD_SHARED_LIBS=ON -DOPUS_BUILD_PROGRAMS=OFF -DOPUS_BUILD_TESTING=OFF \
            -DCMAKE_POLICY_DEFAULT_CMP0091=NEW -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded
          cmake --build opus-bau --config Release
          mkdir -p packaging/opus
          cp opus-bau/Release/opus.dll packaging/opus/opus.dll

      - name: WiX
        run: dotnet tool install --global wix --version 5.0.2

      - name: Clippy auf Windows
        if: inputs.pruefen
        run: cargo clippy --locked -p sprechwerk-fenster -p sprechwerk-server-fenster -p sprechwerk-client --all-targets -- -D warnings

      - name: Pakete bauen
        shell: pwsh
        run: ./packaging/windows/paket.ps1

      - uses: actions/upload-artifact@v7
        with:
          name: pakete-windows
          if-no-files-found: error
          path: |
            dist/*.msi
            dist/*.zip

  macos:
    name: macOS (.dmg, Apple Silicon + Intel)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - uses: dtolnay/rust-toolchain@stable

      - name: Rust für beide Architekturen
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Opus bauen (libopus.0.dylib, arm64 + x86_64)
        run: |
          curl -fsSLo opus.tar.gz "https://downloads.xiph.org/releases/opus/opus-${OPUS_VERSION}.tar.gz"
          echo "${OPUS_SHA256}  opus.tar.gz" | shasum -a 256 -c
          tar xzf opus.tar.gz
          for arch in arm64 x86_64; do
            cmake -S "opus-${OPUS_VERSION}" -B "opus-$arch" \
              -DBUILD_SHARED_LIBS=ON -DOPUS_BUILD_PROGRAMS=OFF -DOPUS_BUILD_TESTING=OFF \
              -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES=$arch \
              -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0
            cmake --build "opus-$arch"
          done
          mkdir -p packaging/opus
          lipo -create opus-arm64/libopus.0.dylib opus-x86_64/libopus.0.dylib \
            -output packaging/opus/libopus.0.dylib
          lipo -info packaging/opus/libopus.0.dylib

      - name: Clippy auf macOS
        if: inputs.pruefen
        run: cargo clippy --locked -p sprechwerk-fenster -p sprechwerk-server-fenster -p sprechwerk-client --all-targets -- -D warnings

      - name: Pakete bauen
        run: packaging/macos/paket.sh

      - uses: actions/upload-artifact@v7
        with:
          name: pakete-macos
          if-no-files-found: error
          path: |
            dist/*.dmg
            dist/*.zip
