# Release: Version, Änderungsliste, Pakete, Container-Abbild.
#
# Ablauf (AGENTS.md §6, release-please):
#   1. Jeder Push auf `master` lässt release-please die Conventional Commits seit
#      dem letzten Release lesen. Gibt es etwas Auslieferbares (`feat`, `fix`, …),
#      öffnet oder aktualisiert es einen PR „chore: Release x.y.z": Version in
#      allen Manifesten angehoben, `CHANGELOG.md` fortgeschrieben.
#   2. Wird **dieser** PR gemergt, legt release-please Tag und GitHub-Release an.
#   3. Im selben Lauf entstehen danach die Dateien und hängen sich ans Release:
#        * Server + Referenzclient (`server.yml`), mit eingebauter
#          Verwaltungsoberfläche: Linux x86_64 und aarch64 (`.tar.gz`),
#          Windows (`.zip`), macOS Apple Silicon + Intel (`.tar.gz`)
#        * Fenster (`pakete.yml`): Linux `.deb`/`.rpm`/AppImage, Flatpak,
#          Windows `.exe`/`.msi`, macOS `.dmg` (Apple Silicon + Intel)
#        * Container-Abbild `docker.io/<benutzer>/sprechwerk`, amd64 + arm64
#        * `SHA256SUMS` über alle Dateien
#
# Warum alles in **einer** Datei: Ein Release, das mit dem `GITHUB_TOKEN`
# angelegt wird, löst keine weiteren Workflows aus (GitHub verhindert so
# Endlosschleifen). Ein getrennter Workflow „on: release" liefe nie.
#
# Aus demselben Grund läuft `pruefen.yml` nicht auf dem Release-PR. Der PR
# ändert nur Versionsnummern und die Änderungsliste; dass Cargo die
# angehobenen Sperrdateien annimmt, prüft hier jeder Bau mit `--locked`.
#
# Ein Bau ist schiefgegangen? „Run workflow" mit dem Tag (z. B. `v0.1.0`) baut
# die Dateien für ein bestehendes Release neu und ersetzt sie.
#
# Windows und macOS sind **unsigniert** (siehe `pakete.yml`).

name: release

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      tag:
        description: "Bestehendes Release neu bauen (z. B. v0.1.0)"
        required: true

# Zwei Releases gleichzeitig würden sich gegenseitig die Dateien überschreiben.
# Nicht abbrechen: ein halb hochgeladenes Release ist schlimmer als ein spätes.
concurrency:
  group: release
  cancel-in-progress: false

permissions: {}

env:
  CARGO_TERM_COLOR: always
  ABBILD: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/sprechwerk

jobs:
  release-please:
    name: Version und Änderungsliste
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    outputs:
      erstellt: ${{ steps.rp.outputs.release_created }}
      tag: ${{ steps.rp.outputs.tag_name }}
    steps:
      - id: rp
        uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Ein Ziel für alle Baujobs, egal ob frisch erstellt oder von Hand nachgebaut.
  #
  # `!cancelled()` hier und in allen Jobs danach: beim Handstart ist
  # release-please übersprungen — und GitHub überspringt sonst jeden Job, der
  # (auch über Umwege) davon abhängt.
  ziel:
    name: Was gebaut wird
    needs: release-please
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.t.outputs.tag }}
      version: ${{ steps.t.outputs.version }}
    steps:
      - id: t
        env:
          HAND: ${{ inputs.tag }}
          ERSTELLT: ${{ needs.release-please.outputs.erstellt }}
          NEU: ${{ needs.release-please.outputs.tag }}
        run: |
          tag=""
          if [ -n "$HAND" ]; then
            tag="$HAND"
          elif [ "$ERSTELLT" = "true" ]; then
            tag="$NEU"
          fi
          if [ -n "$tag" ] && ! [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag „$tag“ hat nicht die Form vX.Y.Z"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
          if [ -z "$tag" ]; then
            echo "Kein neues Release — nur der Release-PR wurde fortgeschrieben."
          fi

  # Server für alle Systeme, mit eingebauter Verwaltungsoberfläche: derselbe
  # Baustein, den `pruefen.yml` bei jedem PR aufruft.
  server:
    name: Server
    needs: ziel
    if: ${{ !cancelled() && needs.ziel.outputs.tag != '' }}
    uses: ./.github/workflows/server.yml
    with:
      ref: ${{ needs.ziel.outputs.tag }}
      version: ${{ needs.ziel.outputs.version }}
    secrets: inherit
    permissions:
      contents: read

  server-hochladen:
    name: Server ans Release
    needs: [ziel, server]
    if: ${{ !cancelled() && needs.ziel.outputs.tag != '' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: server-*
          merge-multiple: true
          path: aus

      - name: Hochladen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          find aus -type f | sort
          find aus -type f -print0 | xargs -0 -r \
            gh release upload "${{ needs.ziel.outputs.tag }}" -R "${{ github.repository }}" --clobber

  # Fenster für alle Systeme: derselbe Baustein, den `pruefen.yml` bei jedem PR
  # aufruft — was hier gebaut wird, ist dort schon einmal durchgelaufen.
  pakete:
    name: Fenster
    needs: ziel
    if: ${{ !cancelled() && needs.ziel.outputs.tag != '' }}
    uses: ./.github/workflows/pakete.yml
    with:
      ref: ${{ needs.ziel.outputs.tag }}
    secrets: inherit
    permissions:
      contents: read

  # Hängt an, was gebaut wurde — auch wenn eine Plattform scheitert: ein
  # Release ohne macOS ist besser als eines ohne alles. Der Lauf bleibt rot,
  # „Run workflow" mit dem Tag holt das Fehlende nach.
  pakete-hochladen:
    name: Fenster ans Release
    needs: [ziel, pakete]
    if: ${{ !cancelled() && needs.ziel.outputs.tag != '' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: pakete-*
          merge-multiple: true
          path: aus

      - name: Hochladen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          find aus -type f | sort
          find aus -type f -print0 | xargs -0 -r \
            gh release upload "${{ needs.ziel.outputs.tag }}" -R "${{ github.repository }}" --clobber

  # Je Architektur auf einem eigenen Läufer gebaut, nicht über QEMU: Rust unter
  # Emulation braucht eine Stunde statt Minuten.
  abbild:
    name: Container ${{ matrix.plattform }}
    needs: [ziel, server]
    if: ${{ !cancelled() && needs.ziel.outputs.tag != '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, plattform: linux/amd64, kurz: amd64 }
          - { os: ubuntu-24.04-arm, plattform: linux/arm64, kurz: arm64 }
    runs-on: ${{ matrix.os }}
    # Kein `packages: write` mehr: das Abbild liegt bei Docker Hub, nicht bei
    # GitHub — angemeldet wird sich mit den Repo-Secrets DOCKERHUB_*.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.ziel.outputs.tag }}

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.ABBILD }}
          labels: |
            org.opencontainers.image.title=sprechwerk
            org.opencontainers.image.description=Sprach- und Texträume für Vereine
            org.opencontainers.image.version=${{ needs.ziel.outputs.version }}

      # Nur nach Prüfsumme hochladen; die Namen (`0.1.0`, `latest`) bekommt erst
      # das gemeinsame Verzeichnis beider Architekturen im nächsten Job.
      - id: bau
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.plattform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.ABBILD }},push-by-digest=true,name-canonical=true,push=true

      - name: Prüfsumme merken
        run: |
          mkdir -p digests
          echo "${{ steps.bau.outputs.digest }}" > "digests/${{ matrix.kurz }}"

      - uses: actions/upload-artifact@v7
        with:
          name: digest-${{ matrix.kurz }}
          path: digests/*
          retention-days: 1

  abbild-namen:
    name: Container benennen
    needs: [ziel, abbild]
    if: ${{ !cancelled() && needs.abbild.result == 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: digest-*
          merge-multiple: true
          path: digests

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # `0.1.0`, `0.1` und `latest`. Vor 1.0 kommt ein Bruch als neue
      # Minor-Version (`bump-minor-pre-major`) — deshalb kein Name `0`.
      - name: Ein Name, zwei Architekturen
        env:
          VERSION: ${{ needs.ziel.outputs.version }}
        run: |
          quellen=""
          for d in digests/*; do quellen="$quellen ${ABBILD}@$(cat "$d")"; done
          docker buildx imagetools create \
            -t "${ABBILD}:${VERSION}" \
            -t "${ABBILD}:${VERSION%.*}" \
            -t "${ABBILD}:latest" \
            $quellen
          docker buildx imagetools inspect "${ABBILD}:${VERSION}"

  pruefsummen:
    name: Prüfsummen
    needs: [ziel, server-hochladen, pakete-hochladen]
    if: ${{ !cancelled() && needs.ziel.outputs.tag != '' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: SHA256SUMS
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.ziel.outputs.tag }}
        run: |
          mkdir aus && cd aus
          gh release download "$TAG" -R "${{ github.repository }}" \
            -p '*.tar.gz' -p '*.zip' -p '*.deb' -p '*.rpm' -p '*.AppImage' \
            -p '*.flatpak' -p '*.exe' -p '*.msi' -p '*.dmg'
          sha256sum * | tee SHA256SUMS
          gh release upload "$TAG" SHA256SUMS -R "${{ github.repository }}" --clobber
