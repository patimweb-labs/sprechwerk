# Prüfen: was vor dem Ausliefern stimmen muss.
#
# Seit ADR 0013 ist alles ein Arbeitsbereich in Rust: Server, Client-Kern,
# beide Fenster und ihre Oberflächentests (egui_kittest über AccessKit) laufen
# mit einem `cargo test --workspace`. Kein Node, keine zweite Sperrdatei.
#
# Dieselben Schritte laufen lokal mit `scripts/pruefen.sh`.
#
# Die Läufer-Version ist **festgelegt** (`ubuntu-24.04`), nicht `ubuntu-latest`:
# GitHub verschiebt `latest` seit Oktober 2026 auf Ubuntu 26 — Paketnamen und
# Bibliotheksstände ändern sich damit unter der Hand. Ein Wechsel soll ein
# bewusster Schritt sein (diese Zeile ändern, Lauf ansehen).

name: prüfen

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

# Ein neuer Lauf ersetzt den alten: bei einem Tippfehler im Branch soll nicht
# der vorige Lauf weiterrechnen.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Schnell scheitern statt minutenlang kompilieren, wenn etwas offensichtlich
  # kaputt ist.
  RUST_BACKTRACE: 1

jobs:
  arbeitsbereich:
    name: Arbeitsbereich — Form, Werkzeuge, Tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # Der Audiopfad lädt `libopus.so.0` zur **Laufzeit** (libloading). Die
      # Tests kodieren und dekodieren wirklich — ohne die Bibliothek scheitern
      # sie mit „Opus-Bibliothek nicht gefunden".
      - name: Laufzeitbibliothek Opus
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libopus0

      # Kann release-please die Version überall anheben, ohne dass `--locked`
      # danach scheitert? (Sonst fällt es erst mitten im Release auf.)
      - name: Versionen und Release-Konfiguration
        run: python3 scripts/versionen.py

      - uses: Swatinem/rust-cache@v2

      - name: Form
        run: cargo fmt --all --check

      - name: Werkzeuge
        run: cargo clippy --all-targets -- -D warnings

  sprache:
    name: Sprache — Messungen am laufenden Server
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # Opus wird zur **Laufzeit** geladen (libloading), deshalb genügt die
      # Laufzeitbibliothek; ALSA braucht der Linux-Bau ohne das Feature `cpal`
      # nicht.
      - name: Laufzeitbibliothek Opus
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libopus0

      # Dieselben Proben wie lokal. Sie brauchen kein Mikrofon und keine zweite
      # Person — nur einen freien Port und einen Serverprozess.
      - name: Ton durch den Server
        run: |
          mkdir -p /tmp/sprachproben
          ./scripts/sprechprobe.sh 2>&1 | tee /tmp/sprachproben/sprechprobe.log

      - name: Vier Sprecher gleichzeitig
        run: |
          mkdir -p /tmp/sprachproben
          ./scripts/lastprobe.sh 2>&1 | tee /tmp/sprachproben/lastprobe.log

      - name: Verlust und Jitter
        run: |
          mkdir -p /tmp/sprachproben
          ./scripts/verlustprobe.sh 2>&1 | tee /tmp/sprachproben/verlustprobe.log

      - name: Messprotokolle
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sprachproben
          path: /tmp/sprachproben/*.log
          if-no-files-found: ignore

  # Das Fenster auf allen Systemen bauen — Linux-Pakete, Flatpak, Windows,
  # macOS (`pakete.yml`). Auf Windows und macOS zusätzlich Clippy: dort sind
  # andere Teile übersetzt (cpal statt PipeWire), die unter Linux nie ein
  # Compiler sieht. Die Pakete hängen als Artefakte am Lauf.
  pakete:
    name: Pakete
    uses: ./.github/workflows/pakete.yml
    with:
      pruefen: true
    secrets: inherit

  # Den Server (Konsole) auf allen Systemen bauen (`server.yml`) — Windows
  # und macOS gibt es dort sonst erst im Release. Die
  # Archive hängen als Artefakte am Lauf, zum Ausprobieren vor dem Release.
  server:
    name: Server
    uses: ./.github/workflows/server.yml
    with:
      pruefen: true
    secrets: inherit
