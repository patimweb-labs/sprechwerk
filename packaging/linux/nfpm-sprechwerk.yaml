# deb und rpm der **Client**-Anwendung (nfpm, https://nfpm.goreleaser.com).
# Aufruf über packaging/linux/paket.sh (aus dem Wurzelverzeichnis), das
# VERSION und ARCH setzt. Umgebungsvariablen setzt nfpm nur in Feldern wie
# `version` und `arch` ein, nicht in `contents` — deshalb steht der Pfad
# dort fest, relativ zum Wurzelverzeichnis.
#
# Enthält nur den Client: sprechwerk-fenster und sprechwerk-cli. Der Server
# ist eine eigene Anwendung (`nfpm-sprechwerk-server.yaml`).
name: sprechwerk
arch: ${ARCH}
platform: linux
version: ${VERSION}
section: net
priority: optional
maintainer: Patrick Weppelmann
description: |
  Sprach- und Texträume für Vereine, selbst gehostet.
  Diese Anwendung: das Fenster (sprechwerk-fenster) und der Referenzclient
  (sprechwerk-cli). Den Server bringt das Paket sprechwerk-server mit.
vendor: Weppelmann
homepage: https://gitea.weppelmann.ddnss.de/patrickweppelmann/sprechwerk
license: MIT
# Ton über PipeWire/PulseAudio, Opus zur Laufzeit (docs/AUDIO.md).
recommends:
  - pulseaudio-utils
overrides:
  deb:
    depends:
      - libopus0
  rpm:
    depends:
      - opus
contents:
  - src: dist/stage/sprechwerk/usr/
    dst: /usr/
    type: tree
