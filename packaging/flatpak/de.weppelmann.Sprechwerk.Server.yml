# Flatpak der **Server**-Anwendung (de.weppelmann.Sprechwerk.Server) aus dem
# Server-Tar von packaging/linux/paket.sh (kein zweiter Bau).
# Aufruf: siehe .github/workflows/pakete.yml (Job server-flatpak).
#
# Eigene App-ID, eigenes Fenster, eigenes Symbol: Client und Server sind zwei
# Anwendungen. Wer den Server als Dienst ohne Fenster betreibt, nimmt das
# Container-Abbild oder das Server-Tar.
id: de.weppelmann.Sprechwerk.Server
runtime: org.freedesktop.Platform
runtime-version: "25.08"
sdk: org.freedesktop.Sdk
command: sprechwerk-server-fenster

finish-args:
  # Fenster (egui über OpenGL)
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --device=dri
  # Der Serverhorst lauscht auf UDP und spricht mit seinen Clienten.
  - --share=network
  # Datenverzeichnis: `--persist` legt es unter ~/.var/app/<id>/sprechwerk ab
  # und blendet es als $HOME/sprechwerk ein. Die Datenbank liegt damit im
  # Benutzerverzeichnis statt neben dem Programm — in der Sandbox ist /app
  # schreibgeschützt (crates/server/src/konfig.rs: SPRECHWERK_DATEN).
  - --persist=sprechwerk
  - --env=SPRECHWERK_DATEN=sprechwerk

modules:
  - name: sprechwerk-server
    buildsystem: simple
    sources:
      - type: file
        path: sprechwerk-server.tar.gz
    build-commands:
      - tar -xzf sprechwerk-server.tar.gz
      - install -Dm755 usr/bin/sprechwerk /app/bin/sprechwerk
      - install -Dm755 usr/bin/sprechwerk-server-fenster /app/bin/sprechwerk-server-fenster
      - mkdir -p /app/share
      - cp -a usr/share/applications usr/share/metainfo usr/share/doc /app/share/
      - cp -a usr/share/icons /app/share/
      # Siehe Client-Manifest: AppStream 1.0 kann SVG nicht lesen und bricht
      # sonst den ganzen Bau ab.
      - rm -rf /app/share/icons/hicolor/scalable
