[package]
name = "sprechwerk-desktop"
version = "1.2.0"
edition = "2021"
license = "MIT"
description = "sprechwerk: Fenster (Tauri 2), übersetzt Befehle in die Logik-Crates"

[[bin]]
name = "sprechwerk-desktop"
path = "src/main.rs"

[lib]
name = "sprechwerk_desktop"
path = "src/lib.rs"

# Die Oberfläche hängt an Logik und Vertrag. Was rechnet, liegt dort und ist
# dort geprüft — dieses Crate übersetzt nur zwischen Fenster und Logik.
[dependencies]
sprechwerk-domain = { path = "../domain" }
sprechwerk-protocol = { path = "../protocol" }
sprechwerk-adapters = { path = "../adapters" }
sprechwerk-ipc = { path = "../ipc" }
# Link-Vorschau: der Absender ruft die Seite ab (ADR 0012 §2).
sprechwerk-linkvorschau = { path = "../linkvorschau" }

# `image-png`: damit das Fenstersymbol aus einer PNG-Datei gesetzt werden kann.
tauri = { version = "2", features = ["image-png"] }
# Links aus dem Chat im Browser des Systems öffnen — nicht im Fenster, das
# sonst die Oberfläche verlässt. Der offizielle Weg in Tauri 2; aufgerufen
# nur aus Rust, nach der Prüfung auf http(s), nie direkt aus der Oberfläche.
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "sync", "time", "net", "macros"] }
thiserror = "2"
anyhow = "1"
bytes = "1"
hex = "0.4"
x25519-dalek = { version = "2", features = ["static_secrets"] }
sprechwerk-audio = { path = "../audio" }

[features]
default = []
# Ohne dieses Merkmal lädt das Programm die Entwicklungs-URL (Port 1423) statt
# der eingebetteten Dateien — beim Ausliefern also mit diesem Merkmal bauen.
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[workspace]
members = []
