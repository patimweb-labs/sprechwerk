# Flatpak für Sprechwerk (ADR 0007).
#
# **Umgepackt, nicht neu gebaut.** Das Programm kommt fertig aus dem `.deb`, das
# der Paketbau ohnehin erzeugt (Ubuntu 24.04, glibc 2.39). Die GNOME-Runtime
# bringt alles mit, was es zur Laufzeit braucht: WebKitGTK 4.1, `libopus.so.0`
# und `pactl`/`parec`/`pacat`/`paplay` für den Ton. So läuft im Flatpak
# **dieselbe** Binärdatei wie im `.deb` — geprüft einmal, nicht zweimal.
#
# Bauen (das `.deb` muss als `sprechwerk.deb` neben dieser Datei liegen):
#
#   cp crates/desktop/target/release/bundle/deb/*.deb crates/desktop/packaging/flatpak/sprechwerk.deb
#   flatpak-builder --user --install-deps-from=flathub --repo=repo --force-clean \
#     bau crates/desktop/packaging/flatpak/de.weppelmann.Sprechwerk.yml
#   flatpak build-bundle repo Sprechwerk.flatpak de.weppelmann.Sprechwerk \
#     --runtime-repo=https://dl.flathub.org/repo/flathub.flatpakrepo
#
# Für Flathub selbst reicht das nicht (dort wird aus den Quellen gebaut, ohne
# Netz); das ist ein eigener Schritt.

id: de.weppelmann.Sprechwerk
runtime: org.gnome.Platform
runtime-version: "51"
sdk: org.gnome.Sdk
command: sprechwerk-desktop

finish-args:
  # Fenster
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --device=dri
  # QUIC zum Server
  - --share=network
  # Mikrofon und Lautsprecher (PipeWire spricht dasselbe Protokoll)
  - --socket=pulseaudio

modules:
  - name: sprechwerk
    buildsystem: simple
    sources:
      - type: file
        path: sprechwerk.deb
      - type: file
        path: de.weppelmann.Sprechwerk.metainfo.xml
      - type: file
        path: ../de.weppelmann.Sprechwerk.desktop
      - type: dir
        path: ../icons
        dest: icons
    build-commands:
      - ar -x sprechwerk.deb
      - tar -xf data.tar.gz
      - install -Dm755 usr/bin/sprechwerk-desktop /app/bin/sprechwerk-desktop
      # Flatpak verlangt, dass Symbol und Starter nach der App-ID heißen.
      - sed 's/^Icon=.*/Icon=de.weppelmann.Sprechwerk/' de.weppelmann.Sprechwerk.desktop
        > starter.desktop
      - install -Dm644 starter.desktop /app/share/applications/de.weppelmann.Sprechwerk.desktop
      - for g in 32x32 128x128 256x256 512x512; do
          install -Dm644 icons/hicolor/$g/apps/sprechwerk.png
            /app/share/icons/hicolor/$g/apps/de.weppelmann.Sprechwerk.png;
        done
      - install -Dm644 icons/hicolor/scalable/apps/sprechwerk.svg
        /app/share/icons/hicolor/scalable/apps/de.weppelmann.Sprechwerk.svg
      - install -Dm644 de.weppelmann.Sprechwerk.metainfo.xml
        /app/share/metainfo/de.weppelmann.Sprechwerk.metainfo.xml
