[package]
name = "sprechwerk-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "sprechwerk: Referenzclient auf der Kommandozeile"
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[[bin]]
name = "sprechwerk-cli"
path = "src/main.rs"

[dependencies]
sprechwerk-domain.workspace = true
sprechwerk-protocol.workspace = true
sprechwerk-adapters.workspace = true

anyhow.workspace = true
tokio.workspace = true
serde_json.workspace = true
ed25519-dalek = { version = "2", features = ["rand_core", "pkcs8"] }
getrandom = "0.2"
hex = "0.4"

[dev-dependencies]
# Für die Ende-zu-Ende-Prüfung des Referenzclients: der Dienst läuft im
# Hintergrundfaden mit eigener Laufzeit, der Client als echter Prozess — nur so
# ist prüfbar, dass sein Abschied ankommt (das Fenster zum Prozessende).
sprechwerk-server = { path = "../server" }
