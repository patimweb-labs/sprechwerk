[package]
name = "sprechwerk-client"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "sprechwerk: Client-Kern ohne Oberfläche (Verbindung, Sprechpfad, Schlüssel, Einstellungen)"

# Was ein Client tut, steht hier — unabhängig davon, wer es anzeigt (Fenster,
# Server-Fenster, Tests). Kein Oberflächen-Crate darf hier hinein.
[dependencies]
sprechwerk-domain.workspace = true
sprechwerk-protocol.workspace = true
sprechwerk-adapters.workspace = true
sprechwerk-ipc = { path = "../ipc" }
sprechwerk-audio = { path = "../audio" }
sprechwerk-linkvorschau = { path = "../linkvorschau" }
serde.workspace = true
serde_json.workspace = true
tokio = { version = "1", features = ["rt", "rt-multi-thread", "sync", "time", "net", "macros"] }
thiserror.workspace = true
anyhow.workspace = true
bytes = "1"
hex.workspace = true
x25519-dalek.workspace = true
