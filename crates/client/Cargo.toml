[package]
name = "sprechwerk-client"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "sprechwerk: Client-Kern ohne Oberfläche (Verbindung, Sprechpfad, Schlüssel, Einstellungen)"
authors.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

# Was ein Client tut, steht hier — unabhängig davon, wer es anzeigt (Fenster,
# Server-Fenster, Tests). Kein Oberflächen-Crate darf hier hinein.
[dependencies]
sprechwerk-domain.workspace = true
sprechwerk-protocol.workspace = true
sprechwerk-adapters.workspace = true
sprechwerk-ipc = { path = "../ipc" }
sprechwerk-audio = { path = "../audio" }
sprechwerk-linkvorschau = { path = "../linkvorschau" }
serde.workspace = true
serde_json.workspace = true
# `fs`, `io-util`: Anhänge lesen und hochladen, ohne das Fenster aufzuhalten.
tokio = { version = "1", features = ["rt", "rt-multi-thread", "sync", "time", "net", "macros", "fs", "io-util"] }
# Dateien wählen und speichern über die Dialoge des Systems (ADR 0012 §3).
# Unter Linux über das XDG-Portal — keine GTK-Entwicklungspakete nötig.
rfd = { version = "0.18", default-features = false, features = ["xdg-portal", "wayland"] }
# Videos und andere Dateien im Programm des Systems öffnen (das Fenster
# spielt kein Video selbst ab).
open = "5"
thiserror.workspace = true
anyhow.workspace = true
bytes = "1"
hex.workspace = true
x25519-dalek.workspace = true
