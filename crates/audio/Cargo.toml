[package]
name = "sprechwerk-audio"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "sprechwerk: Soundkarte und Opus — Aufnahme, Wiedergabe, Vorlauf"

# **Nicht im Arbeitsbereich.** Dieses Crate braucht Systempakete
# (`alsa-lib`, `pkg-config`, `cmake` für das gebündelte Opus) und wird deshalb
# getrennt gebaut:
#
#   sudo dnf install alsa-lib-devel pkgconf-pkg-config cmake
#   cargo build --manifest-path crates/audio/Cargo.toml
#
# Die prüfbare Logik (Vorlauf, Jitter-Puffer, Sprechtaste) liegt bewusst in
# `crates/adapters/src/sprechpfad.rs` und läuft ohne Soundkarte.

[dependencies]
sprechwerk-adapters = { path = "../adapters" }
anyhow = "1"
cpal = "0.15"
audiopus = { version = "0.3.0-rc.0", features = [] }

[workspace]
members = []
