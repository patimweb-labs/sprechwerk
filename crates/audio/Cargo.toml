[package]
name = "sprechwerk-audio"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "sprechwerk: Aufnahme, Wiedergabe, Opus, Vorlauf"

# **Warum kein `cpal` und kein gebündeltes Opus?**
# `cpal` braucht `alsa-lib-devel`, `audiopus` baut Opus mit `cmake`. Beides
# fehlt auf vielen Rechnern, und ein Audiopfad, der sich nicht bauen lässt, ist
# kein Audiopfad. Dieses Crate spricht deshalb direkt mit dem laufenden
# PipeWire/PulseAudio (`parec`/`pacat` — dieselbe Schnittstelle, die auch
# `pactl` benutzt) und bindet das **vorhandene** `libopus.so.0` ein.
#
# Nötig ist damit nur: PipeWire oder PulseAudio (also das, was für Ton ohnehin
# läuft) und `libopus` (auf jeder Distribution mit PipeWire vorhanden).

[dependencies]
sprechwerk-adapters = { path = "../adapters" }
sprechwerk-protocol = { path = "../protocol" }
anyhow = "1"
bytes = "1"
# Opus wird zur **Laufzeit** geladen: dieselbe Binärdatei läuft damit unter
# Windows (opus.dll), macOS (libopus.dylib) und Linux (libopus.so.0), und die
# Bibliothek darf neben der Anwendung liegen.
libloading = "0.9"
# Rauschunterdrückung: RNNoise als reines Rust (kein C, kein cmake).
nnnoiseless = "0.5"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }

[lib]
name = "sprechwerk_audio"
path = "src/lib.rs"

[[bin]]
name = "sprechprobe"
path = "src/bin/sprechprobe.rs"
