[package]
name = "sprechwerk-server"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "sprechwerk"
path = "src/main.rs"

[dev-dependencies]
sprechwerk-adapters.workspace = true
bytes = "1"
tokio.workspace = true
# Anfragen an den Router ohne offenen Port (`ServiceExt::oneshot`).
tower = { version = "0.5", default-features = false, features = ["util"] }

[dependencies]
sprechwerk-domain.workspace = true
sprechwerk-protocol.workspace = true
sprechwerk-store.workspace = true

anyhow.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
serde.workspace = true
serde_json.workspace = true
toml = "0.8"
thiserror = "2"
# Dieselbe Wahl wie im Arbeitsbereich (`Cargo.toml`): ein Anbieter je Prozess.
quinn.workspace = true
rustls.workspace = true
rcgen.workspace = true
ed25519-dalek = { version = "2", features = ["rand_core"] }
getrandom = "0.2"
hex = "0.4"
bytes = "1"
time = "0.3"
# Verwaltungsoberfläche (HTTP, SPEC §2 Nachtrag 2026-11-17). Warum eine
# Abhängigkeit statt ein paar Zeilen über `TcpListener`: HTTP selbst zu zerlegen
# ist genau die Art Code, in der Sicherheitslücken entstehen — und diese
# Oberfläche kann Administratoren ernennen. `axum` (mit `hyper`) läuft auf dem
# `tokio`, das der Server schon benutzt; ohne Standardfunktionen nur HTTP/1,
# JSON und Abfrageparameter.
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "json", "query"] }
