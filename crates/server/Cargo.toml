[package]
name = "sprechwerk-server"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "sprechwerk"
path = "src/main.rs"

[dev-dependencies]
sprechwerk-adapters.workspace = true
bytes = "1"
tokio.workspace = true

[dependencies]
sprechwerk-domain.workspace = true
sprechwerk-protocol.workspace = true
sprechwerk-store.workspace = true

anyhow.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
serde.workspace = true
serde_json.workspace = true
toml = "0.8"
thiserror = "2"
# Dieselbe Wahl wie im Arbeitsbereich (`Cargo.toml`): ein Anbieter je Prozess.
quinn.workspace = true
rustls.workspace = true
rcgen.workspace = true
ed25519-dalek = { version = "2", features = ["rand_core"] }
getrandom = "0.2"
hex = "0.4"
bytes = "1"
time = "0.3"
