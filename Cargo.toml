[workspace]
resolver = "2"
# Die Fensteranwendung ist Tauri und bringt eine eigene [workspace]-Tabelle mit.
exclude = ["crates/desktop"]
members = [
    "crates/domain",
    "crates/protocol",
    "crates/store",
    "crates/adapters",
    "crates/ipc",
    "crates/server",
    "crates/cli",
    "crates/audio",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.80"

[workspace.dependencies]
sprechwerk-domain = { path = "crates/domain" }
sprechwerk-protocol = { path = "crates/protocol" }
sprechwerk-store = { path = "crates/store" }
sprechwerk-adapters = { path = "crates/adapters" }
sprechwerk-ipc = { path = "crates/ipc" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "signal", "sync", "io-util", "io-std"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
quinn = "0.11"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rcgen = "0.13"
ed25519-dalek = { version = "2", features = ["rand_core", "pkcs8"] }
getrandom = "0.2"
# Ende-zu-Ende: reine Rust-Krypto (kein C, auf allen drei Plattformen gleich).
x25519-dalek = { version = "2", features = ["static_secrets"] }
chacha20poly1305 = "0.10"
hkdf = "0.12"
sha2 = "0.10"
nnnoiseless = "0.5"
hex = "0.4"
