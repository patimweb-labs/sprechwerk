[workspace]
resolver = "2"
members = [
    "crates/domain",
    "crates/protocol",
    "crates/store",
    "crates/adapters",
    "crates/ipc",
    "crates/server",
    "crates/cli",
    "crates/audio",
    "crates/linkvorschau",
    "crates/client",
    "crates/oberflaeche",
    "crates/fenster",
    "crates/server-fenster",
]

[workspace.package]
version = "3.0.2"
edition = "2021"
license = "MIT"
# Keine `rust-version`: die Rust-Fassung legt `rust-toolchain.toml` fest (eine
# Stelle, dieselbe für Entwickler, CI und Docker). Ein Feld, das kein Crate
# erbt, war hier nur eine zweite, falsche Angabe (1.80).

[workspace.dependencies]
sprechwerk-domain = { path = "crates/domain" }
sprechwerk-protocol = { path = "crates/protocol" }
sprechwerk-store = { path = "crates/store" }
sprechwerk-adapters = { path = "crates/adapters" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "signal", "sync", "io-util", "io-std", "fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Quantensicherheit (ADR 0010): die hybride Gruppe X25519MLKEM768 gibt es nur im
# Anbieter `aws-lc-rs` — `ring` kennt kein ML-KEM. Der Anbieter ist C-Code
# (`aws-lc-sys`), baut aber ohne zusätzliche Systempakete (C-Compiler genügt).
# Ein Anbieter je Prozess: `ring` und `aws-lc-rs` schließen sich aus, deshalb
# steht die Wahl hier und nirgends sonst.
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-aws-lc-rs"] }
rustls = { version = "0.23", default-features = false, features = ["aws-lc-rs", "std"] }
rcgen = "0.13"
ed25519-dalek = { version = "2", features = ["rand_core", "pkcs8"] }
getrandom = "0.2"
# Ende-zu-Ende: reine Rust-Krypto (kein C, auf allen drei Plattformen gleich).
x25519-dalek = { version = "2", features = ["static_secrets"] }
# Quantensicherer Anteil des Schlüsselaustauschs (ADR 0010 Schritt 2):
# ML-KEM-768 nach FIPS-203, reines Rust, keine Systempakete.
ml-kem = "0.2"
chacha20poly1305 = "0.10"
hkdf = "0.12"
sha2 = "0.10"
nnnoiseless = "0.5"
# Echounterdrückung: WebRTC AEC3 als reines Rust.
aec3 = "0.4"
hex = "0.4"

# Ausgelieferte Programme ohne Symboltabellen: die Fenster schrumpfen dadurch
# auf etwa die Hälfte. Fehlerberichte bleiben lesbar (Panik-Texte bleiben).
[profile.release]
strip = true
