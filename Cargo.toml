[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/proto",
    "crates/store",
    "crates/client",
    "crates/server",
    "crates/cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.80"

[workspace.dependencies]
sprechwerk-core = { path = "crates/core" }
sprechwerk-proto = { path = "crates/proto" }
sprechwerk-store = { path = "crates/store" }
sprechwerk-client = { path = "crates/client" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "signal", "sync", "io-util", "io-std"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
quinn = "0.11"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rcgen = "0.13"
ed25519-dalek = { version = "2", features = ["rand_core", "pkcs8"] }
getrandom = "0.2"
hex = "0.4"
